name: Binance Continuous Paper Bot

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-paper-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run paper trading bot
        run: python -u bot.py

      - name: Save trading data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update trading data"
          git push