name: Binance Momentum Paper Bot

'on':
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: momentum-paper-bot
  cancel-in-progress: false

jobs:
  run-paper-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run paper trading bot
        run: python -u bot.py
        env:
          USDT_INR: "90"

      - name: Save trading data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/trading_data.json
          git diff --cached --quiet || git commit -m "Update trading data"
          git push